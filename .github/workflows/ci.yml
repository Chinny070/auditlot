name: auditlot-ci
on:
  push:
  pull_request:
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/preflight.py
      - run: python -m unittest discover -s tests -v
