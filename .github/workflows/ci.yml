name: auditlot-ci
on:
  push:
  pull_request:

env:
  PYTHONIOENCODING: utf-8
  # genvm-linter (genlayerlabs/genvm-manager releases) and gltest's direct-
  # mode SDK loader (genlayerlabs/genvm releases) each resolve their own
  # GenVM build independently and do not share a version namespace, despite
  # both reading a GENVM_VERSION env var. Pinning each explicitly, in its
  # own step below, avoids depending on "latest release" resolution (which
  # 404'd for genvm-linter on an unauthenticated, cold GitHub Actions
  # runner) and keeps both tools reproducible across CI runs. Confirmed
  # against the GitHub releases API that both tags below ship a usable
  # runner-bundle asset before pinning them here.
  # Must be a GenVM SDK release that actually bundles the specific
  # py-genlayer runner contracts/auditlot.py pins in its Depends header
  # (1jb45aa8ynh2a9c9xn3b7qqh8sm5q93hwfp7jqmwsfhh8jpz09h6). Newer releases
  # (tried v0.6.0-rc5) have dropped that older runner hash entirely
  # ("filename ... not found"); v0.6.0-rc1 -- genvm-linter 0.10.0's own
  # documented default fallback version -- still has it, confirmed by both
  # a local `genvm-lint check` run and this workflow's CI history.
  GENVM_LINTER_VERSION: v0.6.0-rc1

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned tooling
        run: |
          python -m pip install --upgrade pip
          pip install genvm-linter==0.10.0 genlayer-test==0.29.2

      - name: Cache GenVM SDK downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/genvm-linter
            ~/.cache/gltest-direct
          key: genvm-sdk-r2-${{ env.GENVM_LINTER_VERSION }}-v0.3.0-rc7

      - name: Pre-download genvm-linter's pinned GenVM SDK
        # genvm-linter's own `download` command uses urllib.request under the
        # hood and reliably 404s on GitHub Actions runners even though the
        # exact same release-asset URL returns HTTP 200 to a plain curl
        # request from the same runner (confirmed by a one-off diagnostic
        # step during CI setup: curl -IL got a clean 200 through GitHub's
        # release-asset redirect while genvm-lint's own downloader reported
        # 404 for that identical URL). This is a bug in the third-party
        # tool's HTTP client, not a network or config problem on our side.
        # Work around it by fetching the tarball ourselves with curl and
        # placing it at genvm-linter's exact expected cache path
        # (genvm_linter.validate.artifacts.get_tarball_path), so its own
        # download_artifacts() finds it already cached and never makes a
        # network call at all.
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/genvm-linter"
          mkdir -p "$cache_dir"
          dest="$cache_dir/genvm-universal-genlayerlabs-genvm-manager-${{ env.GENVM_LINTER_VERSION }}.tar.xz"
          if [ -s "$dest" ]; then
            echo "already cached: $dest"
          else
            url="https://github.com/genlayerlabs/genvm-manager/releases/download/${{ env.GENVM_LINTER_VERSION }}/genvm-universal.tar.xz"
            curl -sS -L -f -o "$dest" "$url"
          fi
          ls -la "$dest"

      - name: Repository preflight (network/syntax/secret-token checks)
        run: python scripts/preflight.py

      - name: Python compilation check
        run: |
          python -m py_compile contracts/auditlot.py
          python -m py_compile scripts/build_manifest.py scripts/commit.py scripts/preflight.py

      - name: Deterministic protocol-model unit tests
        run: python -m unittest discover -s tests -v

      - name: GenVM lint (AST safety + SDK validation)
        run: genvm-lint check contracts/auditlot.py

      - name: GenVM type check
        run: genvm-lint typecheck contracts/auditlot.py

      - name: GenVM ABI schema extraction
        run: genvm-lint schema contracts/auditlot.py

      - name: GenVM direct-mode (GLSim) behavioral suite
        env:
          # Pinned separately from GENVM_LINTER_VERSION -- see the note on
          # the top-level env block above; this is genlayerlabs/genvm's own
          # tag namespace, not genlayerlabs/genvm-manager's.
          GENVM_VERSION: v0.3.0-rc7
        run: gltest tests/direct -v

      - name: Secret / private-key / local-artifact scan
        run: |
          set -euo pipefail
          fail=0
          # No dotenv, keystore, or raw private-key-shaped files committed.
          if git ls-files | grep -E '(^|/)\.env($|\.)|keystore|\.pem$|\.ppk$|id_rsa|id_ed25519' ; then
            echo "::error::possible secret/key material is tracked in git"
            fail=1
          fi
          # No stray caches/build artifacts committed.
          if git ls-files | grep -E '__pycache__/|\.pyc$|(^|/)\.pytest_cache/|(^|/)artifacts/|(^|/)\.hypothesis/' ; then
            echo "::error::generated cache/artifact files are tracked in git"
            fail=1
          fi
          # Forbidden-network-token scanning (must target only Studionet
          # chain 61999) is scripts/preflight.py's job and runs as its own
          # step above; not duplicated here to avoid this workflow file's
          # own necessarily-literal grep patterns tripping that same scan.
          exit $fail
